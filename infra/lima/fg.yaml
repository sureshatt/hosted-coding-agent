# Lima VM that hosts the whole platform. On macOS this VM is the outer
# isolation boundary: an escape from a session container lands here, not on
# the Mac. scripts/setup.sh starts it and adds a single read-only mount of the
# repository; nothing else from the host is shared.
vmType: vz
cpus: 4
memory: 8GiB
disk: 40GiB

images:
  - location: https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-arm64.img
    arch: aarch64
  - location: https://cloud-images.ubuntu.com/releases/noble/release/ubuntu-24.04-server-cloudimg-amd64.img
    arch: x86_64

# Lima mounts the user's home directory by default. Override it: no host
# mounts here; setup.sh adds the repository read-only.
mounts: []

# Do not forward guest ports to the Mac.
portForwards:
  - guestIP: 127.0.0.1
    guestPortRange: [1, 65535]
    ignore: true
  - guestIP: 0.0.0.0
    guestPortRange: [1, 65535]
    ignore: true

containerd:
  system: false
  user: false

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -euxo pipefail
      export DEBIAN_FRONTEND=noninteractive
      if ! command -v docker >/dev/null; then
        apt-get update
        apt-get install -y --no-install-recommends \
          docker.io docker-buildx nftables python3 python3-venv git jq ca-certificates curl gnupg
      fi
      if ! command -v runsc >/dev/null; then
        curl -fsSL https://gvisor.dev/archive.key | gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" \
          > /etc/apt/sources.list.d/gvisor.list
        apt-get update
        apt-get install -y runsc
      fi
      # Session runtimes use gVisor with --network=host: gVisor passes socket
      # calls to the kernel inside the session's namespace (owned by the
      # enforcer), so the enforcer's nftables rules apply. gVisor's default
      # network mode takes over that interface instead and breaks it for later
      # sessions; see docs/decisions.md (D1) and spikes/netns-gvisor/.
      cat > /etc/docker/daemon.json <<'EOF'
      {
        "runtimes": {
          "runsc-kernelnet": { "path": "/usr/bin/runsc", "runtimeArgs": ["--network=host"] }
        },
        "ipv6": false,
        "icc": false,
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" }
      }
      EOF
      systemctl restart docker
      # Log netfilter drops from container namespaces to the VM kernel log,
      # where the detector reads them and session containers cannot.
      echo "net.netfilter.nf_log_all_netns=1" > /etc/sysctl.d/90-fg.conf
      sysctl --system >/dev/null
      usermod -aG docker "{{.User}}"
      install -d -m 0700 -o "{{.User}}" /var/lib/fg

probes:
  - script: |
      #!/bin/bash
      set -eux -o pipefail
      timeout 300 bash -c 'until command -v runsc >/dev/null && sudo docker info >/dev/null 2>&1; do sleep 3; done'
    hint: Docker or gVisor did not finish installing; see /var/log/cloud-init-output.log in the VM.
